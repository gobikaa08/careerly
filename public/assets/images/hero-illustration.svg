<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hero-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="hero-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="primary-bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="teal-bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E1B4B" flood-opacity="0.12"/>
    </filter>
    <filter id="pill-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4F46E5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <rect x="20" y="20" width="560" height="420" rx="32" fill="url(#hero-grad-bg)"/>
  <circle cx="480" cy="90" r="140" fill="#8B5CF6" fill-opacity="0.12" filter="blur(40px)"/>
  <circle cx="120" cy="360" r="120" fill="#06B6D4" fill-opacity="0.12" filter="blur(40px)"/>

  <!-- Trajectory Grid Pattern -->
  <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 6" opacity="0.6">
    <line x1="60" y1="120" x2="540" y2="120" />
    <line x1="60" y1="220" x2="540" y2="220" />
    <line x1="60" y1="320" x2="540" y2="320" />
    <line x1="160" y1="60" x2="160" y2="400" />
    <line x1="300" y1="60" x2="300" y2="400" />
    <line x1="440" y1="60" x2="440" y2="400" />
  </g>

  <!-- Main Central Interactive Card (Dashboard Preview) -->
  <g filter="url(#card-shadow)">
    <rect x="90" y="60" width="420" height="320" rx="20" fill="url(#hero-card-grad)" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Top Bar -->
    <rect x="90" y="60" width="420" height="48" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="118" cy="84" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="134" cy="84" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="150" cy="84" r="5" fill="#10B981" opacity="0.8"/>
    <rect x="180" y="74" width="160" height="20" rx="6" fill="#E2E8F0" opacity="0.7"/>
    <rect x="440" y="72" width="50" height="24" rx="12" fill="#EEF2FF"/>
    <text x="452" y="88" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#4F46E5">PRO</text>

    <!-- Card Content: Readiness Gauge & Skill Bars -->
    <g transform="translate(120, 130)">
      <!-- Readiness Circular Metric -->
      <circle cx="65" cy="65" r="52" stroke="#EEF2FF" stroke-width="10" fill="none"/>
      <circle cx="65" cy="65" r="52" stroke="url(#primary-bar-grad)" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="326" stroke-dashoffset="52" fill="none" transform="rotate(-90 65 65)"/>
      <text x="65" y="60" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#0F172A" text-anchor="middle">88%</text>
      <text x="65" y="78" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">JOB READY</text>

      <!-- Skill Breakdown Bars -->
      <g transform="translate(150, 10)">
        <text x="0" y="10" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1E293B">Full-Stack Engineering Match</text>
        
        <!-- Skill 1 -->
        <text x="0" y="36" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748B">React &amp; TypeScript</text>
        <text x="180" y="36" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#4F46E5" text-anchor="end">94%</text>
        <rect x="0" y="42" width="180" height="7" rx="3.5" fill="#EEF2FF"/>
        <rect x="0" y="42" width="168" height="7" rx="3.5" fill="url(#primary-bar-grad)"/>

        <!-- Skill 2 -->
        <text x="0" y="68" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748B">System Architecture</text>
        <text x="180" y="68" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#06B6D4" text-anchor="end">82%</text>
        <rect x="0" y="74" width="180" height="7" rx="3.5" fill="#EEF2FF"/>
        <rect x="0" y="74" width="148" height="7" rx="3.5" fill="url(#teal-bar-grad)"/>

        <!-- Skill 3 -->
        <text x="0" y="100" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748B">API &amp; Cloud Infra</text>
        <text x="180" y="100" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#8B5CF6" text-anchor="end">89%</text>
        <rect x="0" y="106" width="180" height="7" rx="3.5" fill="#EEF2FF"/>
        <rect x="0" y="106" width="160" height="7" rx="3.5" fill="#8B5CF6"/>
      </g>
    </g>

    <!-- Bottom Milestone Progress Bar -->
    <g transform="translate(120, 290)">
      <rect x="0" y="0" width="360" height="56" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="#10B981" fill-opacity="0.15"/>
      <path d="M 23 28 L 27 32 L 34 24" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0F172A">Phase 3: Production APIs Mastered</text>
      <text x="52" y="40" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748B">Next: System Design &amp; Resume Tailoring</text>
      <rect x="270" y="18" width="76" height="22" rx="11" fill="#4F46E5"/>
      <text x="308" y="33" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONTINUE</text>
    </g>
  </g>

  <!-- Floating Badge 1: AI Match Badge (Top Right) -->
  <g transform="translate(420, 36)" filter="url(#pill-shadow)">
    <rect x="0" y="0" width="160" height="52" rx="14" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1"/>
    <circle cx="26" cy="26" r="14" fill="#6366F1"/>
    <path d="M 22 26 L 25 29 L 30 22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0F172A">Top Match Found</text>
    <text x="48" y="38" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#4F46E5">96% AI Alignment</text>
  </g>

  <!-- Floating Badge 2: Resume Check (Bottom Left) -->
  <g transform="translate(30, 340)" filter="url(#pill-shadow)">
    <rect x="0" y="0" width="180" height="54" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="28" cy="27" r="14" fill="#10B981"/>
    <path d="M 23 27 L 27 31 L 34 23" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0F172A">Resume ATS Score</text>
    <text x="50" y="40" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#059669">92/100 • Interview Ready</text>
  </g>

  <!-- Dynamic Curved Connecting Vector -->
  <path d="M 120 180 C 60 220 50 280 90 350" stroke="#818CF8" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6"/>
  <path d="M 480 300 C 530 250 540 180 500 100" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6"/>
</svg>
