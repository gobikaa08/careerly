<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="careerly-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="careerly-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Logo Icon: Modern Compass & Upward Career Trajectory Chevron -->
  <g transform="translate(6, 6)" filter="url(#glow)">
    <!-- Background rounded squircle -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#careerly-grad-primary)"/>
    
    <!-- Geometric C / Compass Loop -->
    <path d="M 34 16 C 24 12 16 18 16 26 C 16 34 24 40 34 36" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95"/>
    
    <!-- Forward Trajectory Arrow / Navigator Compass Needle -->
    <path d="M 24 34 L 38 20 M 38 20 L 28 19 M 38 20 L 37 30" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Sparkle / AI North Star indicator -->
    <circle cx="38" cy="20" r="2.5" fill="#FFFFFF"/>
    <circle cx="18" cy="18" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(70, 40)">
    <text x="0" y="0" font-family="'Inter', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="#0F172A" class="brand-text-main">
      Career<tspan fill="#4F46E5">ly</tspan>
    </text>
    <text x="1" y="14" font-family="'Inter', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" letter-spacing="1.8" fill="#64748B" class="brand-text-sub">
      AI CAREER NAVIGATOR
    </text>
  </g>
</svg>
